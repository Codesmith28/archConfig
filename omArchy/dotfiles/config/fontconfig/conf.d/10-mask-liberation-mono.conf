<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 1. Completely reject Liberation Mono from font enumeration and scanning -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Liberation Mono</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>LiberationMono</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>

  <!-- 2. Rewrite any explicit pattern requests for Liberation Mono to system monospace -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Mono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>LiberationMono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>

  <!-- 3. Alias fallback in case an application bypasses pattern matching -->
  <alias binding="same">
    <family>Liberation Mono</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>LiberationMono</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>
</fontconfig>
