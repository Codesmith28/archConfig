# ==============================================================================
# Intel AX211 / USB Bluetooth Module Configuration
# ==============================================================================
# Disables USB autosuspend on btusb to prevent transceiver sleep desync during
# audio playback, voice calls, and suspend/resume transitions.
#
# Note: Do NOT set force_scofix=1 on Intel CNVi / AX211 (8087:0033). That flag
# activates BTUSB_WRONG_SCO_MTU (legacy Broadcom/CSR quirk forcing sco_mtu=64),
# which overrides the Intel controller's hardware SCO MTU and causes/worsens
# "corrupted SCO packet" and "SCO packet for unknown connection handle" errors.
# ==============================================================================
options btusb enable_autosuspend=0
