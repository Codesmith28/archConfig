# ==============================================================================
# Bluetooth Daemon (bluez) High-Performance Configuration
# ==============================================================================
[General]
# Accelerates paging and inquiry scan parameters for fast device reconnection
FastConnectable = true

# Prevents pairing key corruption across OS boots / reconnects
JustWorksRepairing = always

# Enables Bluetooth Battery Reporting (KDE Plasma system tray) and LE Audio features
Experimental = true

# Allows concurrent connection of A2DP audio, AVRCP media controls, and HFP telephony
MultiProfile = multiple

[Policy]
# Automatically powers on the Bluetooth controller at boot and after system resume
AutoEnable = true

# Aggressively re-attempts connection if device momentarily drops out
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64
