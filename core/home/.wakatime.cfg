[settings]
debug = false

# Privacy Settings: Hide file names, project names, and branches
# hide_file_names = true ensures no file paths or file names are sent to API or shown publicly
hide_file_names = true
hidefilenames = true
hide_branch_names = true
hide_project_folder = true
hide_dependencies = true

# Local machine secret configuration (API key kept strictly out of git)
import_cfg = ~/.wakatime.cfg.local

ignore =
    COMMIT_EDITMSG$
    PULLREQ_EDITMSG$
    MERGE_MSG$
    TAG_EDITMSG$

# Anonymize all projects to a single generic label in memory
# Setting hide_project_names = false prevents wakatime-cli from generating .wakatime-project files on disk
hide_project_names = false

[projectmap]
.+ = Coding
