[settings]
debug = false

# Privacy Settings: Hide file names, project names, and branches
# Only share language, time, and editor (safe for public leaderboards)
hide_file_names = true
hidefilenames = true
hide_project_names = true
hide_branch_names = true
hide_project_folder = true
hide_dependencies = true

# Local machine secret configuration (API key kept strictly out of git)
import_cfg = ~/.wakatime.cfg.local

ignore =
    COMMIT_EDITMSG$
    PULLREQ_EDITMSG$
    MERGE_MSG$
    TAG_EDITMSG$
