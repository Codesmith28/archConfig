# ==============================================================================
# WirePlumber Bluetooth Configuration
# ==============================================================================
# Enables automatic switching to headset mode (mSBC HD Voice mic) during calls
# (e.g. Google Meet, Zoom, Discord, Brave WebRTC) and automatically restores
# High-Fidelity AAC Stereo playback as soon as the call ends.
# ==============================================================================
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.profile-preference = "quality"
}
