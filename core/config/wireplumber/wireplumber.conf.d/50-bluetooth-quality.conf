# ==============================================================================
# WirePlumber Bluetooth Configuration
# ==============================================================================
# Enables automatic switching to headset mode (mSBC HD Voice mic) during calls
# (e.g. Google Meet, Zoom, Discord, Brave WebRTC) and automatically restores
# High-Fidelity AAC Stereo playback as soon as the call ends.
# ==============================================================================
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = false
  bluetooth.profile-preference = "quality"

  # Dynamic target selection: do not pin streams to hardware nodes
  node.stream.restore-target = false

  # Do not give +30000 priority bonus to past default device; let new devices take over dynamically
  node.restore-default-targets = false

  # Follow default audio devices dynamically when Bluetooth connects or disconnects
  linking.follow-default-target = true
  linking.allow-moving-streams = true
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  # Enable mSBC HD Voice (16kHz wideband speech) for crystal clear call audio
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  # Only register PC as audio source and telephony audio gateway for headphones.
  # Do NOT register as a2dp_sink or hfp_hf to avoid reverse negotiation collisions.
  bluez5.roles = [ "a2dp_source", "hfp_ag", "hsp_ag", "bap_source" ]
  bluez5.hfphsp-backend = "native"
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2050
        priority.driver = 2050
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2050
        priority.driver = 2050
      }
    }
  }
]
