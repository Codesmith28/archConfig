# ==============================================================================
# WirePlumber 0.5 Bluetooth Audio Quality & Dynamic Call Routing Configuration
# ==============================================================================
# 1. Seamless Dynamic Switching:
#    - When on a call / mic capture stream is active: switch to HFP headset mode (16kHz mSBC HD Voice).
#    - When call ends / idle: automatically restore pristine A2DP high-fidelity stereo.
# 2. Never Stuck in Headset Mode:
#    - Disables persistent profile storage across reconnects or toggles.
#    - On connection or reconnect, always evaluates and activates the highest quality A2DP profile.
# 3. Rogue Stream Prevention:
#    - Assigns bluez_input lower priority (500) than internal mic (2009) so background
#      apps do not hold the Bluetooth mic open, while keeping it fully selectable for calls.
# ==============================================================================

wireplumber.settings = {
  ## Dynamic profile autoswitching
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.autoswitch-switch-timeout = 500
  bluetooth.autoswitch-restore-timeout = 1500

  ## Prevent saving temporary headset mode across reconnects or toggles
  bluetooth.use-persistent-storage = false
  device.restore-profile = false

  ## Enforce high quality audio as default target
  bluetooth.profile-preference = "quality"
  node.stream.restore-target = false
  node.restore-default-targets = false
  linking.follow-default-target = true
  linking.allow-moving-streams = true
}

monitor.bluez.properties = {
  ## High-quality codecs & SBC-XQ
  bluez5.codecs = [ "ldac", "aptx_hd", "aptx", "aac", "sbc_xq", "sbc" ]
  bluez5.enable-sbc-xq = true

  ## Upgrade HFP call voice quality from 8kHz CVSD to 16kHz mSBC HD Voice
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true

  ## Enable A2DP and HFP Audio Gateway roles for headset playback + calls.
  ## Omits legacy HSP (avoids 8kHz CVSD fallback), hfp_hf (prevents
  ## rfcomm_bind: Address already in use across GDM/user sessions and resume),
  ## and bap_sink/bap_source (prevents Operation not supported without kernel ISO sockets).
  bluez5.roles = [ "a2dp_sink", "a2dp_source", "hfp_ag" ]
  bluez5.hfphsp-backend = "native"
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        # Higher than internal speakers (1009) so BT becomes default playback sink when connected
        priority.session = 2050
        priority.driver = 2050
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        # Lower than internal mic (2009) so background capture doesn't hijack BT,
        # but available for selection in call apps
        priority.session = 500
        priority.driver = 500
      }
    }
  }
]
