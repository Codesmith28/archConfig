<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- =================================================================== -->
  <!-- Default Monospace: JetBrains Mono                                   -->
  <!-- =================================================================== -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- Default System UI & Sans: Adwaita Sans                              -->
  <!-- =================================================================== -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

</fontconfig>
