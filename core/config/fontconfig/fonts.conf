<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- =================================================================== -->
 <!-- 1. Mask Liberation Mono Fonts                                       -->
 <!-- Completely exclude Liberation Mono from font matching and listing   -->
 <!-- so it is never selected as a system fallback.                       -->
 <!-- =================================================================== -->
 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <string>Liberation Mono</string>
    </patelt>
   </pattern>
   <pattern>
    <patelt name="family">
     <string>LiberationMono</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>
 <!-- =================================================================== -->
 <!-- 2. Browser Default Monospace -> Generic 'monospace'                 -->
 <!-- Map browser defaults and legacy fallbacks (Courier, Courier New,    -->
 <!-- Liberation Mono, TeX Gyre Cursor) directly to 'monospace'.          -->
 <!-- Placed before the primary monospace match so they cascade properly. -->
 <!-- =================================================================== -->
 <match target="pattern">
  <test name="family">
   <string>Courier</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>Courier New</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>Liberation Mono</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>LiberationMono</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family">
   <string>TeX Gyre Cursor</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <!-- =================================================================== -->
 <!-- 3. Default Monospace Font                                           -->
 <!-- Primary monospace font family definition.                           -->
 <!-- =================================================================== -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>DepartureMono Nerd Font</string>
   <string>Jetbrainsmono Nerd Font</string>
   <string>Hack Nerd Font</string>
  </edit>
 </match>
 <!-- =================================================================== -->
 <!-- 4. Font Rendering Settings & Local Font Directory                   -->
 <!-- =================================================================== -->
 <dir prefix="xdg">fonts</dir>
 <dir>~/.local/share/fonts</dir>
 <match target="pattern">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="pattern">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
