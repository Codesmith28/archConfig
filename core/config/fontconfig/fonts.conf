<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- =================================================================== -->
  <!-- 1. System Default Family Preference Lists                           -->
  <!-- Defines the single source of truth for generic 'monospace',         -->
  <!-- 'sans-serif', and 'serif'.                                          -->
  <!-- =================================================================== -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>RecMonoSmCasual Nerd Font</string>
      <string>JetbrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- =================================================================== -->
  <!-- 2. Browser Default Monospace -> Generic 'monospace'                 -->
  <!-- Map unremovable browser defaults and system fallbacks (Courier,     -->
  <!-- Courier New, Liberation Mono, TeX Gyre Cursor) directly to          -->
  <!-- generic 'monospace'.                                                -->
  <!--                                                                     -->
  <!-- Any browser or application querying these legacy names delegates    -->
  <!-- to 'monospace', providing a single source of truth for all          -->
  <!-- monospace fonts across the system.                                  -->
  <!-- =================================================================== -->
  <match target="pattern">
    <test name="family"><string>Courier</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>LiberationMono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TeX Gyre Cursor</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>monospace</string>
    </edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Adwaita</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

</fontconfig>
