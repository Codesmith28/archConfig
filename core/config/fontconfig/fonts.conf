<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ===================================================================
       1. Browser / Legacy Monospace Aliases -> Generic 'monospace'
       Map browser defaults and legacy fallbacks (Courier, Courier New,
       Liberation Mono, TeX Gyre Cursor) to the generic 'monospace' family.
       NOTE: Must stay above the Primary Font Stack to cascade correctly.
       =================================================================== -->

  <match target="pattern">
    <test name="family">
      <string>Courier</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Courier New</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Liberation Mono</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>LiberationMono</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>TeX Gyre Cursor</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>monospace</string>
    </edit>
  </match>


  <!-- ===================================================================
       2. Primary Monospace Font Stack
       Preferred fonts resolved in order when 'monospace' is requested.
       =================================================================== -->

  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit binding="strong" mode="prepend_first" name="family">
      <string>JetbrainsMono Nerd Font</string>
      <string>AdwaitaMono Nerd Font</string>
      <string>Hack Nerd Font</string>
    </edit>
  </match>


  <!-- ===================================================================
       3. Font Directories
       Local font search paths — scanned in addition to system defaults.
       =================================================================== -->

  <dir prefix="xdg">fonts</dir>
  <dir>~/.local/share/fonts</dir>


  <!-- ===================================================================
       4. Reject / Mask Unwanted Fonts
       Completely exclude Liberation Mono from font matching and listing
       so it is never selected as a system fallback.
       =================================================================== -->

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Liberation Mono</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>LiberationMono</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>


  <!-- ===================================================================
       5. Global Font Rendering Settings
       Sub-pixel rendering, hinting, and anti-aliasing for all fonts.
       =================================================================== -->

  <match target="pattern">
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
