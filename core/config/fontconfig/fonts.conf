<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ===================================================================
       1. Monospace Font Aliases (DRY Architecture)
       Selectively alias legacy monospace fonts (Courier, Courier New,
       Liberation Mono, LiberationMono, TeX Gyre Cursor) to generic 'monospace'.
       This avoids duplicating preferred fonts into every legacy override.
       =================================================================== -->

  <alias binding="same">
    <family>Courier</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Courier New</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Liberation Mono</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>LiberationMono</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>TeX Gyre Cursor</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>Droid Sans Mono</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>


  <!-- ===================================================================
       2. Preferred Monospace Font Stack
       Single source of truth for the 'monospace' font family definition.
       Using binding="strong" ensures our preferred font stack takes
       precedence over system defaults while avoiding prepend_first
       hijacking of other installed monospace families (Adwaita Mono,
       Noto Sans Mono, Source Code Pro, Terminess Nerd Font, etc.).
       =================================================================== -->

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font</family>
      <family>DepartureMono Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>


  <!-- ===================================================================
       3. Font Directories
       Local font search paths — scanned in addition to system defaults.
       =================================================================== -->

  <dir prefix="xdg">fonts</dir>
  <dir>~/.local/share/fonts</dir>


  <!-- ===================================================================
       4. Reject / Mask Unwanted Fonts
       Completely exclude Liberation Mono from font matching and listing
       so it is never selected as a system fallback.
       =================================================================== -->

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Liberation Mono</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>LiberationMono</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>


  <!-- ===================================================================
       5. Global Font Rendering Settings
       Sub-pixel rendering, hinting, and anti-aliasing for all fonts.
       =================================================================== -->

  <match target="pattern">
    <edit mode="assign" name="hinting">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
