general {
    lock_cmd = pidof hyprlock || pidof swaylock || (command -v hyprlock >/dev/null 2>&1 && hyprlock || swaylock) # Lock command, prevent duplicate instances
    before_sleep_cmd = loginctl lock-session                                                                     # Lock screen before suspend
    after_sleep_cmd = hyprctl dispatch dpms on                                                                   # Turn on display after resume
    ignore_dbus_inhibit = false                                                                                  # Respect dbus idle-inhibit requests
}

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                                                                                               # 5 minutes
    on-timeout = loginctl lock-session || (command -v hyprlock >/dev/null 2>&1 && hyprlock || swaylock)          # Lock screen with hyprlock/swaylock
}

# Turn off display after 5.5 minutes of inactivity
listener {
    timeout = 330                                                                                               # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off                                                                      # Screen off
    on-resume = hyprctl dispatch dpms on                                                                        # Screen on
}

# Suspend system after 30 minutes of inactivity
listener {
    timeout = 1800                                                                                              # 30 minutes
    on-timeout = systemctl suspend                                                                              # Suspend PC
}
