# Fanciest Hyprlock Configuration
# Catppuccin Mocha aesthetic with glassmorphic elements and dynamic user display

auth {
    pam {
        module = system-auth
    }
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# Dynamic blurred screenshot background with solid dark fallback
background {
    monitor =
    path = screenshot
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.95
    noise = 0.0117
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Profile picture (if present)
image {
    monitor =
    path = $HOME/.cache/profile/profile.png
    size = 180
    rounding = -1
    border_size = 3
    border_color = rgba(203, 166, 247, 0.8) # Mauve
    rotate = 0
    reload_time = -1
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
}

# Username Display (Dynamic)
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.9)
    font_size = 28
    font_family = monospace
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 2
}

# Password Input Field
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(30, 30, 46, 0.6)       # Base with alpha
    outer_color = rgba(203, 166, 247, 0.6)      # Mauve
    font_color = rgb(205, 214, 244)            # Text
    font_family = monospace
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f488">🔒 Enter Password</span>
    hide_input = false
    rounding = 25
    check_color = rgba(137, 180, 250, 0.8)     # Blue
    fail_color = rgba(243, 139, 168, 0.8)      # Red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 2
}

# Time (Bottom Right)
label {
    monitor =
    text = cmd[update:1000] echo "<b><span foreground='##cdd6f4'>$(date +"%H")</span><span foreground='##cba6f7'>:</span><span foreground='##cdd6f4'>$(date +"%M")</span></b>"
    color = rgba(205, 214, 244, 1.0)
    font_size = 72
    font_family = monospace
    position = -50, 75
    halign = right
    valign = bottom
    shadow_passes = 4
    shadow_size = 5
}

# Date (Bottom Right)
label {
    monitor =
    text = cmd[update:1000] echo "<b><span foreground='##cdd6f4'>$(date +"%A")</span><span foreground='##89b4fa'>, </span><span foreground='##cdd6f4'>$(date +"%d %B")</span></b>"
    color = rgba(205, 214, 244, 0.85)
    font_size = 18
    font_family = monospace
    position = -50, 40
    halign = right
    valign = bottom
    shadow_passes = 3
    shadow_size = 4
}
