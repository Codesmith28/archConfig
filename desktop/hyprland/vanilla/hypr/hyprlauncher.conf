# ==============================================================================
# Hyprlauncher Configuration (hyprwm/hyprlauncher)
# Native App Launcher & Picker for Hyprland
# ==============================================================================

# General Behavior
general {
    # Whether to force full keyboard focus grab when opened
    grab_focus = true
}

# Entry History and Caching
cache {
    # Remember and prioritize frequently used choices in ~/.local/share/hyprlauncher
    enabled = true
}

# Search Providers / Modules
finders {
    # Default search finder when opened (desktop applications)
    default_finder = desktop

    # Render desktop application icons in search results
    desktop_icons = true

    # Provider trigger prefixes
    # Type '=' to switch to inline math calculation (via libqalculate)
    math_prefix = "="

    # Type '.' to switch to unicode / emoji picker
    unicode_prefix = "."

    # Type '\'' to switch to system font picker
    font_prefix = "'"
}

# User Interface Dimensions & Appearance
ui {
    # Dimensions (width height in pixels)
    window_size = 560 380
}
