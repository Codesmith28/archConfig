###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER

# Paths
$HYPRSCRIPTS = $HOME/.config/hypr/scripts

# ------------------------------------------------------------------------------
# Core Applications & Launchers (GNOME & Native Hyprland Standards)
# ------------------------------------------------------------------------------
# Terminal: Ctrl+Alt+T (GNOME standard) & Super+Return
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, $terminal --class=big_float

# File Manager: Super+E (GNOME standard)
bind = $mainMod, E, exec, $fileManager

# Application Launcher / Grid: Super+A, Super+Space, Super+D
bind = $mainMod, A, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D, exec, $menu

# Window Switcher: Super+Tab & Alt+Tab (omalt-tab if available, fallback to launcher-window)
bind = $mainMod, Tab, exec, $HYPRSCRIPTS/launcher-window.sh
bind = ALT, Tab, exec, sh -c 'command -v quickshell >/dev/null 2>&1 && omalt-tab-client next || $HYPRSCRIPTS/launcher-window.sh'

# Web Browser: Super+B
bind = $mainMod, B, exec, $browser

# Text Editor: Super+Ctrl+E (GNOME Text Editor / system editor)
bind = $mainMod CTRL, E, exec, $editor

# Emoji Picker: Super+.
bind = $mainMod, period, exec, $HYPRSCRIPTS/launcher-emoji.sh

# Screen Lock: Super+L (GNOME standard)
bind = $mainMod, L, exec, sh -c 'command -v hyprlock >/dev/null 2>&1 && hyprlock || [ -x "$HOME/.local/bin/hyprlock" ] && "$HOME/.local/bin/hyprlock" || loginctl lock-session'

# Notification Center: Super+M (GNOME message tray standard) & Super+N
bind = $mainMod, M, exec, swaync-client -t -swa
bind = $mainMod, N, exec, swaync-client -t -swa

# Clipboard History: Super+V
bind = $mainMod, V, exec, $HYPRSCRIPTS/clipboard.sh

# Power Menu & Session: Super+Escape / Super+Ctrl+Q / Super+Shift+Q
bind = $mainMod, Escape, exec, $HYPRSCRIPTS/launcher-power.sh
bind = $mainMod CTRL, Q, exec, command -v wlogout >/dev/null 2>&1 && wlogout || $HYPRSCRIPTS/launcher-power.sh
bind = $mainMod SHIFT, Q, exec, $HYPRSCRIPTS/logout.sh

# ------------------------------------------------------------------------------
# Network, Bluetooth, Audio & Hardware Settings
# ------------------------------------------------------------------------------
# Wi-Fi Settings: Super+Ctrl+W
bind = $mainMod CTRL, W, exec, $HYPRSCRIPTS/wifi.sh

# Bluetooth Manager: Super+Ctrl+B
bind = $mainMod CTRL, B, exec, $HYPRSCRIPTS/bluetooth.sh

# Bluetooth Audio Codec Switcher: Super+Alt+B & Super+Ctrl+Shift+B
bind = $mainMod ALT, B, exec, $HYPRSCRIPTS/bluetooth-codec.sh
bind = $mainMod CTRL SHIFT, B, exec, $HYPRSCRIPTS/bluetooth-codec.sh

# Audio Mixer (Pavucontrol): Super+Ctrl+V
bind = $mainMod CTRL, V, exec, sh -c 'command -v pavucontrol >/dev/null 2>&1 && pavucontrol || $HYPRSCRIPTS/volume-control.sh mixer'
bind = $mainMod SHIFT CTRL, V, exec, pavucontrol

# Color Picker & System Monitor
bind = $mainMod CTRL, P, exec, hyprpicker -a
bind = $mainMod SHIFT, X, exec, $terminal --class=big_float -e btop

# Wallpaper Picker & Keybindings Cheatsheet
bind = $mainMod, W, exec, $HYPRSCRIPTS/wallpicker.sh
bind = $mainMod, slash, exec, $HYPRSCRIPTS/keybindings_cheatsheet.sh
bind = $mainMod SHIFT, slash, exec, $HYPRSCRIPTS/keybindings_cheatsheet.sh
bind = $mainMod, question, exec, $HYPRSCRIPTS/keybindings_cheatsheet.sh

# Status Bar Toggle / Reload
bind = $mainMod SHIFT, B, exec, $HYPRSCRIPTS/waybar.sh
bind = $mainMod ALT, B, exec, pkill -x waybar

# Light/Dark Theme Toggle
bind = $mainMod ALT, T, exec, $HYPRSCRIPTS/theme-toggle.sh --menu

# ------------------------------------------------------------------------------
# Window Management (GNOME Standard Alignment)
# ------------------------------------------------------------------------------
# Close / Kill active window: Super+Q & Alt+F4
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,

# GNOME Standard Window Snapping & Maximizing:
# Super+Up: Maximize window
# Super+Down: Unmaximize / restore window
# Super+Left: Snap window left
# Super+Right: Snap window right
# Super+H: Minimize window (scratchpad)
bind = $mainMod, Up, exec, $HYPRSCRIPTS/window-control.sh maximize
bind = $mainMod, Down, exec, $HYPRSCRIPTS/window-control.sh restore
bind = $mainMod, Left, exec, $HYPRSCRIPTS/window-control.sh left
bind = $mainMod, Right, exec, $HYPRSCRIPTS/window-control.sh right
bind = $mainMod, H, exec, $HYPRSCRIPTS/window-control.sh minimize

# Directional focus navigation: Super+Alt+Arrows
bind = $mainMod ALT, left, movefocus, l
bind = $mainMod ALT, right, movefocus, r
bind = $mainMod ALT, up, movefocus, u
bind = $mainMod ALT, down, movefocus, d

# Center active window: Super+C
bind = $mainMod, C, centerwindow

# Toggle & Cycle Floating sizes:
# Super+T: Toggle floating mode
# Super+Shift+F: Cycle through Small (680x440) -> Medium (960x600) -> Big (1200x780)
# Super+Ctrl+F: Resize active window as Small Float (680x440)
# Super+Alt+F: Resize active window as Medium Float (960x600)
# Super+Ctrl+Shift+F / Super+Ctrl+Alt+F: Resize active window as Big Float (1200x780)
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, F, exec, $HYPRSCRIPTS/toggle-float.sh cycle
bind = $mainMod CTRL, F, exec, $HYPRSCRIPTS/toggle-float.sh small
bind = $mainMod ALT, F, exec, $HYPRSCRIPTS/toggle-float.sh medium
bind = $mainMod CTRL SHIFT, F, exec, $HYPRSCRIPTS/toggle-float.sh big
bind = $mainMod CTRL ALT, F, exec, $HYPRSCRIPTS/toggle-float.sh big

# Fullscreen toggles: Super+F / F11
bind = $mainMod, F, fullscreen, 0
bind = , F11, fullscreen, 0

# Split & Tiling Layout adjustments
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, P, pseudo,
bind = $mainMod, G, togglegroup
bind = ALT CTRL, right, changegroupactive, f
bind = ALT CTRL, left, changegroupactive, b

# Move active window within layout
bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d

# Resize active window with arrows
binde = $mainMod SHIFT, right, resizeactive, 80 0
binde = $mainMod SHIFT, left, resizeactive, -80 0
binde = $mainMod SHIFT, up, resizeactive, 0 -80
binde = $mainMod SHIFT, down, resizeactive, 0 80

# Mouse Window Actions (Move / Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

# ------------------------------------------------------------------------------
# Workspace Navigation (1-10 & GNOME-style PageUp/PageDown)
# ------------------------------------------------------------------------------
# Switch to workspace 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# GNOME-style Workspace Navigation (PageUp / PageDown / Ctrl+Alt+Arrows)
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, Page_Down, workspace, e+1
bind = CTRL ALT, Up, workspace, e-1
bind = CTRL ALT, Down, workspace, e+1
bind = $mainMod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mainMod SHIFT, Page_Down, movetoworkspace, e+1

# Workspace switching with mouse scroll & Ctrl+Arrows
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

# Special Workspace (Scratchpad / Magic)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, U, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic
bind = $mainMod SHIFT, U, movetoworkspace, special:magic

# ------------------------------------------------------------------------------
# Screenshots (GNOME setup powered by grim, slurp, and swappy)
# ------------------------------------------------------------------------------
# Region screenshot: Print, Super+Shift+S, Super+Alt+S
bind = , Print, exec, $HYPRSCRIPTS/screenshot.sh region
bind = $mainMod, Print, exec, $HYPRSCRIPTS/screenshot.sh output
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/screenshot.sh region
bind = $mainMod ALT, S, exec, $HYPRSCRIPTS/screenshot.sh region

# Window screenshot (GNOME screenshot-window): Alt+Print & Super+Shift+W
bind = ALT, Print, exec, $HYPRSCRIPTS/screenshot.sh window
bind = $mainMod SHIFT, W, exec, $HYPRSCRIPTS/screenshot.sh window

# Fullscreen / Output screenshot (GNOME screenshot): Super+Shift+A & Shift+Print
bind = SHIFT, Print, exec, $HYPRSCRIPTS/screenshot.sh output
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/screenshot.sh output

# Interactive annotation screenshot (Swappy): Super+Shift+E
bind = $mainMod SHIFT, E, exec, $HYPRSCRIPTS/screenshot.sh annotate

# ------------------------------------------------------------------------------
# Hardware & Multimedia Keys
# ------------------------------------------------------------------------------
# Volume controls
binde = , XF86AudioRaiseVolume, exec, $HYPRSCRIPTS/volume.sh 5%+
binde = , XF86AudioLowerVolume, exec, $HYPRSCRIPTS/volume.sh 5%-
bind = , XF86AudioMute, exec, $HYPRSCRIPTS/volume.sh toggle
bind = , XF86AudioMicMute, exec, $HYPRSCRIPTS/mic.sh toggle

# Brightness controls
binde = , XF86MonBrightnessUp, exec, $HYPRSCRIPTS/brightness.sh +
binde = , XF86MonBrightnessDown, exec, $HYPRSCRIPTS/brightness.sh -
binde = , XF86BrightnessUp, exec, $HYPRSCRIPTS/brightness.sh +
binde = , XF86BrightnessDown, exec, $HYPRSCRIPTS/brightness.sh -

# Media playback controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioRewind, exec, playerctl position 5-
bindl = , XF86AudioForward, exec, playerctl position 5+

# Power, Sleep & Bluetooth keys
bind = , XF86PowerOff, exec, systemctl suspend
bind = , XF86Sleep, exec, systemctl suspend
bindl = , XF86Bluetooth, exec, sh -c 'bluetoothctl show | grep -q "Powered: yes" && bluetoothctl power off || bluetoothctl power on'
