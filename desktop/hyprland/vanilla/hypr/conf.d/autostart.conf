#################
### AUTOSTART ###
#################

# 1. Environment & Dbus session integration
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 1.1 Import GNOME appearance & theme settings (GTK theme, icons, cursor, fonts)
exec-once = ~/.config/hypr/scripts/import-gnome-theme.sh

# 2. Polkit Authentication Agent & Keyring Daemons
# Priority: hyprpolkitagent -> polkit-gnome -> polkit-kde
exec-once = sh -c 'if command -v hyprpolkitagent >/dev/null 2>&1; then hyprpolkitagent; elif [ -x /usr/libexec/hyprpolkitagent ]; then /usr/libexec/hyprpolkitagent; elif [ -x /usr/lib/hyprpolkitagent ]; then /usr/lib/hyprpolkitagent; elif [ -x /usr/libexec/polkit-gnome-authentication-agent-1 ]; then /usr/libexec/polkit-gnome-authentication-agent-1; elif [ -x /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 ]; then /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1; elif [ -x /usr/lib/polkit-kde-authentication-agent-1 ]; then /usr/lib/polkit-kde-authentication-agent-1; elif [ -x /usr/libexec/kf6/kpolkitagent ]; then /usr/libexec/kf6/kpolkitagent; fi'
exec-once = sh -c 'command -v gnome-keyring-daemon >/dev/null 2>&1 && gnome-keyring-daemon --start --components=secrets,pkcs11'

# 2.1 Hardware Acceleration & GPU Environment Detection
exec-once = ~/.config/hypr/scripts/gpu-detect.sh --apply

# 3. Status Bar & Notification Daemon
exec-once = ~/.config/hypr/scripts/waybar.sh
exec-once = sh -c 'command -v swaync >/dev/null 2>&1 && swaync'

# 4. Wallpaper Management
exec-once = ~/.config/hypr/scripts/wallpaper-init.sh

# 5. Idle & Screen Locking Daemon
exec-once = sh -c 'command -v hypridle >/dev/null 2>&1 && hypridle'

# 6. Clipboard Daemon
exec-once = sh -c 'command -v clipse >/dev/null 2>&1 && clipse -listen || python3 ~/.config/hypr/scripts/clipboard-daemon.py'

# 7. Network Applet
exec-once = sh -c 'command -v nm-applet >/dev/null 2>&1 && nm-applet --indicator'

# 8. KDE Wallet (if on KDE / Plasma backend)
exec-once = sh -c '[ -x /usr/lib/pam_kwallet_init ] && /usr/lib/pam_kwallet_init'
exec-once = sh -c 'command -v kwalletd6 >/dev/null 2>&1 && kwalletd6'

# 9. Hyprlauncher Daemon (Instant application launcher)
exec-once = sh -c 'command -v hyprlauncher >/dev/null 2>&1 && hyprlauncher -d'

# 10. QuickShell & omalt-tab autostart
exec-once = sh -c 'command -v quickshell >/dev/null 2>&1 && quickshell -p ~/.config/omalt-tab'

# 11. Session Cleanup Daemon (resets graphical-session.target on exit for seamless GNOME login)
exec-once = sh -c '~/.config/hypr/scripts/session-cleanup.sh &'

