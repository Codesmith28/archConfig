###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Default Terminal: Dynamic resolver using GNOME default terminal (Ptyxis / gnome-terminal), with Kitty / Ghostty fallback
$terminal = ~/.config/hypr/scripts/terminal.sh

# Default Web Browser: Native GNOME / GIO default browser
$browser = sh -c 'if command -v gio >/dev/null 2>&1; then exec gio open https://; else exec xdg-open https://; fi'

# Default File Manager: Native GNOME Nautilus (direct invocation to prevent terminal open hijacking)
$fileManager = sh -c 'if command -v nautilus >/dev/null 2>&1; then exec nautilus ~; elif command -v gio >/dev/null 2>&1; then exec gio open ~; else exec xdg-open ~; fi'

# Default Text Editor: Native GNOME / GTK default text editor via MIME
$editor = sh -c 'gtk-launch $(xdg-mime query default text/plain 2>/dev/null) 2>/dev/null || exec gnome-text-editor "$@"'

# Default Office Suite / Document Writer: Native GNOME / LibreOffice Writer via MIME
$writer = sh -c 'gtk-launch $(xdg-mime query default application/vnd.oasis.opendocument.text 2>/dev/null) 2>/dev/null || exec libreoffice --writer "$@"'
$office = $writer

# Application Launcher: Native Hyprlauncher (fallback to launcher-apps.sh)
$menu = ~/.config/hypr/scripts/launcher-apps.sh
