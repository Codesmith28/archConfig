#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# Catppuccin Mocha Palette:
# Base: #1e1e2e | Mantle: #181825 | Crust: #11111b
# Surface0: #313244 | Surface1: #45475a | Surface2: #585b70
# Text: #cdd6f4 | Mauve: #cba6f7 | Blue: #89b4fa | Lavender: #b4befe

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Polished Catppuccin Mocha gradient for active borders
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)

    # Enable resizing windows by dragging borders and gaps
    resize_on_border = true
    extend_border_grab_area = 15

    allow_tearing = false
    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Window Opacity
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    # Subtle modern drop shadows
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(11111b77)
        color_inactive = rgba(11111b44)
    }

    # Glassmorphic blur
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Refined Bezier Curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.25, 1, 0.5, 1
    bezier = fluent, 0.1, 1, 0, 1
    bezier = throw, 0.4, 0, 0.2, 1
    bezier = magic, 0.16, 1, 0.3, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = fluentDecel, 0.16, 1, 0.3, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    # Animation mappings
    animation = windows, 1, 3.5, overshot, popin 80%
    animation = windowsIn, 1, 3.5, overshot, popin 85%
    animation = windowsOut, 1, 2.5, smoothOut, popin 85%
    animation = border, 1, 4.0, fluent
    animation = fade, 1, 2.5, almostLinear
    animation = workspaces, 1, 3.5, fluent, slide
    animation = specialWorkspace, 1, 3.5, magic, slidevert
}

# Layer blur rules for Waybar, Hyprlauncher, Wofi, Rofi, SwayNC, and Wlogout
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, hyprlauncher
layerrule = ignorezero, hyprlauncher
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = ignorealpha 0.1, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.1, swaync-notification-window
layerrule = blur, wlogout
layerrule = ignorezero, wlogout

# Layout details
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# XWayland 100% native unscaled rendering
xwayland {
    force_zero_scaling = true
}

# Miscellaneous (Optimized frame pacing & power saving)
misc {
    vfr = true
    vrr = 0
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
