##############################
### WINDOWS AND WORKSPACES ###
##############################

# Suppress maximize requests from all apps
windowrulev2 = suppressevent maximize, class:.*

# Fix XWayland dragging issues
windowrulev2 = nofocus, class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Center all floating windows
windowrulev2 = center, floating:1

# Small float rules (for nmtui, bluetooth, cheatsheet, and transient utilities)
windowrulev2 = float, class:^(small_float)$
windowrulev2 = size 680 440, class:^(small_float)$
windowrulev2 = center, class:^(small_float)$
windowrulev2 = float, title:^(nmtui|bluetoothctl|bluetuith|bluetui)$
windowrulev2 = size 680 440, title:^(nmtui|bluetoothctl|bluetuith|bluetui)$
windowrulev2 = center, title:^(nmtui|bluetoothctl|bluetuith|bluetui)$

# Big float rules
windowrulev2 = float, class:^(big_float)$
windowrulev2 = size 1200 780, class:^(big_float)$
windowrulev2 = center, class:^(big_float)$

# Utility / Transient apps: float and centered
windowrulev2 = float, class:^(blueman-manager|pavucontrol|org.pulseaudio.pavucontrol|qalculate-gtk|nm-connection-editor)$
windowrulev2 = size 680 440, class:^(blueman-manager|pavucontrol|org.pulseaudio.pavucontrol|qalculate-gtk)$
windowrulev2 = center, class:^(blueman-manager|pavucontrol|org.pulseaudio.pavucontrol|qalculate-gtk)$

# Authentication, Polkit, and GPG Prompts
windowrulev2 = float, class:^(hyprpolkitagent|polkit-gnome-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|pinentry-.*)$
windowrulev2 = center, class:^(hyprpolkitagent|polkit-gnome-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|pinentry-.*)$

# Common file pickers and dialog prompts
windowrulev2 = float, title:^(Open File|Open Files|Open Folder|All Files|Save As|File Upload|Authentication Required|Choose Files)(.*)$
windowrulev2 = size 950 650, title:^(Open File|Open Files|Open Folder|All Files|Save As|File Upload|Authentication Required|Choose Files)(.*)$
windowrulev2 = center, title:^(Open File|Open Files|Open Folder|All Files|Save As|File Upload|Authentication Required|Choose Files)(.*)$

# Picture-in-Picture windows: float and pin
windowrulev2 = float, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = pin, title:^(Picture-in-Picture|Picture in picture)$

# Launcher and Wlogout rules
windowrulev2 = float, class:^(hyprlauncher)$
windowrulev2 = center, class:^(hyprlauncher)$
windowrulev2 = float, class:^(rofi)$
windowrulev2 = fullscreen, class:^(wlogout)$

# Clipse clipboard manager window rules
windowrulev2 = float, class:^(clipse)$
windowrulev2 = size 650 650, class:^(clipse)$
windowrulev2 = center, class:^(clipse)$
windowrulev2 = stayfocused, class:^(clipse)$

# SwayNC Notification Center & OSD window rules (fallback if unmanaged by layer-shell)
windowrulev2 = float, class:^(swaync|sway-notification-center)$
windowrulev2 = nofocus, class:^(swaync|sway-notification-center)$
windowrulev2 = pin, class:^(swaync|sway-notification-center)$
windowrulev2 = noborder, class:^(swaync|sway-notification-center)$
windowrulev2 = noshadow, class:^(swaync|sway-notification-center)$
