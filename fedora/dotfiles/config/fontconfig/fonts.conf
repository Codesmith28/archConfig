<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- =================================================================== -->
  <!-- 1. Default Family Preferences                                       -->
  <!-- =================================================================== -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <!-- =================================================================== -->
  <!-- 2. Monospace Overrides                                              -->
  <!-- =================================================================== -->
  <match target="pattern"><test name="family" qual="any"><string>Courier</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Courier New</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Consolas</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Menlo</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Monaco</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>DejaVu Sans Mono</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Liberation Mono</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>LiberationMono</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Ubuntu Mono</string></test><edit name="family" mode="assign" binding="strong"><string>monospace</string></edit></match>

  <!-- =================================================================== -->
  <!-- 3. Sans-Serif Overrides                                             -->
  <!-- =================================================================== -->
  <match target="pattern"><test name="family" qual="any"><string>Arial</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Helvetica</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Helvetica Neue</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Liberation Sans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>LiberationSans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Arimo</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>DejaVu Sans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Noto Sans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Roboto</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Open Sans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Cantarell</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Ubuntu</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>TeX Gyre Heros</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Nimbus Sans</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Nimbus Sans L</string></test><edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit></match>

  <!-- =================================================================== -->
  <!-- 4. Serif Overrides                                                  -->
  <!-- =================================================================== -->
  <match target="pattern"><test name="family" qual="any"><string>Times</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Times New Roman</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Times Roman</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Liberation Serif</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>LiberationSerif</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>DejaVu Serif</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Noto Serif</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>NotoSerif</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Georgia</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Garamond</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Palatino</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Palatino Linotype</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Book Antiqua</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Century Schoolbook</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Nimbus Roman</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Nimbus Roman No9 L</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>TeX Gyre Termes</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Cambria</string></test><edit name="family" mode="assign" binding="strong"><string>serif</string></edit></match>

</fontconfig>
