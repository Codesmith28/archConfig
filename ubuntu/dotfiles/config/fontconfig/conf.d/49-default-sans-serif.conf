<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Set default sans-serif font preferences -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu Nerd Font</family>
      <family>Ubuntu</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Ubuntu Nerd Font</family>
      <family>Ubuntu</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Ubuntu Nerd Font</family>
      <family>Ubuntu</family>
    </prefer>
  </alias>
</fontconfig>
